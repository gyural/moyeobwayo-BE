spring:
  boot:
    admin:
      client:
        url: ${spring-admin-address:http://ec2-54-180-107-93.ap-northeast-2.compute.amazonaws.com:8090}  # Admin Server URL
        instance:
          service-url: ${backend-server-address:http://localhost:8080}  # 클라이언트의 서비스 주소
  springdoc:
    api-doc:
      enable: false
  jackson:
    time-zone: Asia/Seoul
  application:
    name: moyeobwayo
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: update  # 테이블 자동 생성 및 업데이트
      # ddl-auto: create # 기존 테이블 삭제 후 새로 생성
    show-sql: false  # SQL 쿼리 로그 콘솔 출력
  datasource:
    hikari:
      maximum-pool-size: 4
    url: ${db-url:jdbc:postgresql://localhost:5432/moyeobwayo}
    username: ${db-username:postgres}
    password: ${db-password:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always  # 데이터 초기화 O
      # mode: never # 데이터 초기화 X

logging:
  file:
    name: ./application.log
  logback:
    rollingpolicy:
      file-name-pattern: application.%d{yyyy-MM-dd}-%i.log
      max-file-size: 10KB
  pattern:
    dateformat: Asia/Seoul
  level:
    root: info
server:
  port: 8080
